[package]
name = "aural-client"
version = "0.8.6"
description = "Client for Aural, an open source voice and chat platform with self-hosted servers"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the Android and iOS entry points link against.
# Desktop builds go through src/main.rs, which calls into it.
[lib]
name = "aural_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png is what lets the taskbar overlay icon be handed to the window as
# PNG bytes: without it Tauri has no decoder and the badge silently does not
# appear. tray-icon is the same story for the tray: without it the builder
# exists but does nothing.
tauri = { version = "2", features = ["image-png", "tray-icon"] }
rfd = "0.15"
tauri-plugin-notification = "2"

# The system settings file: the handful of answers that have to be readable
# before the webview that would otherwise hold them exists.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Launching with the session is a registry key on Windows, a LaunchAgent plist
# on macOS and a .desktop file on Linux, and is nothing at all on a phone --
# which is also why the plugin does not build for one. It is driven from Rust
# rather than from the page, so the whole system settings page is one command.
#
# A second launch has to reach the first window rather than open its own. That
# matters most for the two settings that hide the window: somebody who cannot
# see Aural will try the shortcut again, and without this they would get a
# second copy holding the same session rather than the one already running.
#
# Updating in place is desktop only for the same reason. A phone installs
# through a store or a package manager, which is the thing that updates it;
# nothing here is allowed to replace an APK behind its back. `process` is here
# because an update is only finished once the new binary is the one running,
# and relaunching is what the updater cannot do for itself.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Answering the webview's own microphone prompt needs the handle underneath it.
# Both are already in the tree by way of tauri and wry, and both are pinned to
# what those resolve to so the interfaces are the same types theirs are.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# The features are what decide which of Windows this build can reach, and three
# groups are in play. `Media_Control` is the media session — the thing that
# draws the track on the lock screen, and the whole of the "listening to"
# source. The `Win32_System_Pipes`/`IO`/`Threading` group is the named pipe a
# game's rich presence is written to, which has to be overlapped so that
# turning the feature off can actually release it. `Win32_Storage_FileSystem`
# carries both the pipe's client side and the version resource an executable
# keeps its readable name in.
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
# Cover art arrives from the media session as whatever the player had on hand,
# which for a browser can be far larger than anything a member list draws. It
# is re-encoded down to 128 pixels before being broadcast to every connected
# member, and these two are the decode and the encoding of the result. Both are
# already in the tree by way of Tauri, so naming them costs no new dependency.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[features]
default = []

[lints.rust]
linker_messages = "allow"

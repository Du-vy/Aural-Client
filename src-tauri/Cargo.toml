[package]
name = "aural-client"
version = "0.1.0"
description = "Client for Aural, an open source voice and chat platform with self-hosted servers"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the Android and iOS entry points link against.
# Desktop builds go through src/main.rs, which calls into it.
[lib]
name = "aural_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"

# Answering the webview's own microphone prompt needs the handle underneath it.
# Both are already in the tree by way of tauri and wry, and both are pinned to
# what those resolve to so the interfaces are the same types theirs are.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[features]
default = []

[lints.rust]
linker_messages = "allow"
